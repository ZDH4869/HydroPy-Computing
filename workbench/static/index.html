<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#091522">
  <meta name="description" content="HydroLab 水文计算助手。查看洪水过程、流域面雨量、水库调洪和真实算例的计算结果。">
  <title>HydroLab · 水文计算助手</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2C8 8 5 12 5 15a7 7 0 0 0 14 0c0-3-3-7-7-13Z' fill='%2366e7f5'/%3E%3C/svg%3E">
  <script type="module" src="/static/app.js"></script>
</head>
<body data-course="engineering">
  <div class="backplate" aria-hidden="true"></div>
  <a class="skip-link" href="#workbench">跳到工作区</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="HydroLab 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M16 4C13 9 8 13.5 8 19a8 8 0 1 0 16 0c0-5.5-5-10-8-15Z" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 19c2.3-2.7 4.3-2.7 6.5 0s4.2 2.7 6.5 0M11 23c1.8-1.8 3.2-1.8 5 0s3.2 1.8 5 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span>HydroLab</span>
      </a>
      <nav class="course-tabs" id="courseTabs" aria-label="课程"></nav>
      <div class="topbar-actions">
        <button class="detail-button case-button" type="button" id="caseButton" aria-haspopup="dialog">
          结果对比 <span id="caseCount">0</span>
        </button>
        <div class="engine-status" id="engineStatus" role="status"><span class="status-dot"></span><span>连接引擎中</span></div>
      </div>
    </div>
  </header>

  <main class="layout" id="workbench" tabindex="-1">
    <div class="workspace" data-pane="settings">
      <header class="workspace-intro">
        <p class="course-label" id="breadcrumb">三门水文课程的计算工作台</p>
        <h1>水文计算助手</h1>
        <h2 id="algoTitle">正在加载算法</h2>
        <p id="algoDescription"></p>
      </header>

      <div class="algorithm-nav">
        <span class="algorithm-label" id="algorithmHeading">算法</span>
        <nav id="algoRail" aria-labelledby="algorithmHeading"></nav>
      </div>

      <div class="workspace-tabs" id="workspaceTabs" role="group" aria-label="工作区视图">
        <button type="button" data-pane="settings" aria-controls="settingsPanel" aria-pressed="true">算例配置</button>
        <button type="button" data-pane="chart" aria-controls="chartPanel" aria-pressed="false">图表</button>
        <button type="button" data-pane="metrics" aria-controls="outputMetrics" aria-pressed="false" disabled>关键指标</button>
      </div>

      <div class="workspace-side">
        <aside class="panel settings" id="settingsPanel" aria-labelledby="settingsTitle">
          <div class="settings-heading">
            <h2 id="settingsTitle">算例配置</h2>
            <div class="settings-actions">
              <button type="button" class="text-button" id="advancedToggle" aria-haspopup="dialog" hidden>高级参数</button>
              <button type="button" class="text-button" id="resetButton" disabled>恢复示例</button>
            </div>
          </div>
          <form id="runForm" novalidate>
            <div class="settings-body">
              <div class="settings-block" id="inputBlock">
                <h3>输入数据</h3>
                <div id="fileList" class="file-list"></div>
              </div>
              <div class="settings-block" id="paramsBlock">
                <h3>计算参数</h3>
                <div class="field-grid" id="paramFields"></div>
              </div>
            </div>
            <div class="run-zone">
              <button class="run-button" id="runButton" type="submit" disabled>
                <span id="runIcon" aria-hidden="true"></span><strong id="runLabel">运行计算</strong><kbd>Ctrl / ⌘ + ↵</kbd>
              </button>
              <div id="runStatus" class="run-status" role="status">正在连接本地工作台</div>
            </div>
          </form>
        </aside>

        <aside class="panel result-summary" id="outputMetrics" aria-labelledby="summaryHeading" hidden></aside>
      </div>

      <section class="panel chart-panel" id="chartPanel" aria-labelledby="chartTitle">
        <div class="chart-heading">
          <div>
            <h2 id="chartTitle">过程线</h2>
            <p id="chartMeta"></p>
          </div>
          <div class="view-switch" id="viewSwitch" aria-label="图表视图"></div>
        </div>
        <div id="fileTabs" class="choice-row" aria-label="输入文件" hidden></div>
        <div id="chartGroups" class="choice-row" aria-label="图表分组" hidden></div>
        <div id="chartMount" class="chart-mount"></div>
        <div class="chart-actions">
          <div id="chartFoot" class="chart-foot" hidden></div>
          <div id="outputDetails" class="output-details" hidden></div>
        </div>
      </section>
    </div>

    <footer><span id="sceneLabel">水文观测场景示意</span><a href="/api/catalog" target="_blank" rel="noreferrer">API 目录 ↗</a></footer>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <dialog class="detail-dialog" id="advancedBox" aria-labelledby="advancedTitle">
    <div class="dialog-heading">
      <h2 id="advancedTitle">高级参数</h2>
      <form method="dialog"><button type="submit" class="icon-button" aria-label="关闭高级参数">×</button></form>
    </div>
    <div id="advancedFields" class="field-grid dialog-content"></div>
  </dialog>
  <dialog class="detail-dialog" id="detailsDialog" aria-labelledby="detailsTitle">
    <div class="dialog-heading">
      <h2 id="detailsTitle"></h2>
      <form method="dialog"><button type="submit" class="icon-button" aria-label="关闭详情">×</button></form>
    </div>
    <div id="detailsBody" class="dialog-content"></div>
  </dialog>
  <dialog class="detail-dialog" id="caseDialog" aria-labelledby="caseTitle">
    <div class="dialog-heading">
      <h2 id="caseTitle">结果对比</h2>
      <form method="dialog"><button type="submit" class="icon-button" aria-label="关闭结果对比" autofocus>×</button></form>
    </div>
    <div class="dialog-content">
      <p id="caseStatus" role="status"></p>
      <div class="case-grid" id="caseToolbar" hidden>
        <label>算例 A<select class="case-run-select"></select></label>
        <label>算例 B<select class="case-run-select"></select></label>
      </div>
      <div class="case-grid">
        <section class="case-card" data-case-side="0" aria-label="算例 A 的结果" hidden></section>
        <section class="case-card" data-case-side="1" aria-label="算例 B 的结果" hidden></section>
      </div>
    </div>
  </dialog>
  <dialog id="lightbox" aria-labelledby="lightboxCaption">
    <button type="button" class="close-button" id="lightboxClose" aria-label="关闭">×</button>
    <figure><img id="lightboxImage" alt=""><figcaption id="lightboxCaption"></figcaption></figure>
  </dialog>
</body>
</html>
